<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Runner Pro">
  <meta name="description" content="Allenamento running, gel energetici, diario alimentare e monitoraggio del peso.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Runner Pro</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow" id="todayLabel">RUNNER PRO</div>
        <h1 id="pageHeading">Ciao, runner <span class="wave">👋</span></h1>
      </div>
      <button class="avatar" aria-label="Apri impostazioni" data-nav="settings">RP</button>
    </header>

    <main id="view" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Navigazione principale">
      <button class="tab active" data-nav="home"><span class="tab-icon">⌂</span><span>Home</span></button>
      <button class="tab" data-nav="plan"><span class="tab-icon">◷</span><span>Piano</span></button>
      <button class="tab" data-nav="gels"><span class="tab-icon">⚡</span><span>Gel</span></button>
      <button class="tab" data-nav="food"><span class="tab-icon">◉</span><span>Nutrizione</span></button>
      <button class="tab" data-nav="settings"><span class="tab-icon">⚙</span><span>Impostazioni</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <dialog id="modal" class="modal"><div id="modalContent"></div></dialog>
  <script src="app.js"></script>
</body>
</html>
